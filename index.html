<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pahina Bonus Vault</title>
<meta name="description" content="Your Pahina Builder bonuses: Funnel Builder Playbook, Client-Getting Script Pack, Ready-Made Portfolio Pack and Niche Brief Swipe File.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10;--bg2:#111318;--card:#15171D;--card2:#1B1E26;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#ECEDF1;--mute:#9298A6;--dim:#5F6573;--acc:#7C74F0;--acc2:#A9A3F7;--accbg:rgba(124,116,240,.12);--accline:rgba(124,116,240,.38);
  --ok:#3CCB8B;--okbg:rgba(60,203,139,.12);--warn:#F5B942;--warnbg:rgba(245,185,66,.1);
  --r:14px;--ease:cubic-bezier(.16,1,.3,1);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -20px rgba(0,0,0,.6);
  --serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#F6F6F9;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F2F2F7;--line:rgba(16,18,27,.08);--line2:rgba(16,18,27,.14);
  --ink:#14151B;--mute:#5D6270;--dim:#9AA0AD;--acc:#5B52E0;--acc2:#5B52E0;--accbg:rgba(91,82,224,.08);--accline:rgba(91,82,224,.35);
  --ok:#14955F;--okbg:rgba(20,149,95,.09);--warn:#B7791F;--warnbg:rgba(183,121,31,.08);--shadow:0 1px 2px rgba(16,18,27,.05),0 12px 32px -16px rgba(16,18,27,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--acc2)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accbg)}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);opacity:.55}
.app{position:relative;z-index:1;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:var(--ink)}
.logo-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.04em}
.logo b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.logo>span:last-child>span{display:block;font-size:11px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{color:var(--ink);background:var(--card2)}
.nav a.on{color:var(--ink);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--accline)}
.nav a.on svg{color:var(--acc2)}
.nav .n{margin-left:auto;font:500 10.5px var(--mono);color:var(--dim)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-bottom:8px}
.prog-top b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .8s var(--ease)}
.theme{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);padding:4px 6px}
.tgl{width:40px;height:22px;border-radius:99px;border:1px solid var(--line2);background:var(--card2);position:relative;cursor:pointer;padding:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .3s var(--ease)}
:root[data-theme="light"] .tgl::after{transform:translateX(18px)}
/* topbar (mobile) */
.top{display:none}
main{min-width:0;padding:40px clamp(18px,4vw,56px) 100px}
.view{display:none;max-width:1080px;margin:0 auto}
.view.on{display:block;animation:viewIn .6s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* type */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);padding:5px 10px;border-radius:99px;background:var(--accbg);border:1px solid var(--accline)}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 0 var(--acc2);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc2) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
h1{font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-.035em;font-weight:700;margin:18px 0 14px}
h2{font-size:clamp(22px,3vw,30px);line-height:1.15;letter-spacing:-.025em;font-weight:700;margin:0 0 8px}
h3{font-size:16px;letter-spacing:-.01em;font-weight:600;margin:0 0 6px}
em.s{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--acc2);letter-spacing:-.01em;font-size:1.1em}
.lead{font-size:17px;color:var(--mute);max-width:640px;margin:0}
.sub{color:var(--mute);margin:0 0 22px;max-width:680px}
.sec{margin-top:56px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.kicker{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:block}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);position:relative}
.cards{display:grid;gap:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.lift{transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.lift:hover{transform:translateY(-3px);border-color:var(--accline)}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accbg);color:var(--acc2);border:1px solid var(--accline);margin-bottom:14px}
.ico svg{width:20px;height:20px}
.muted{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.acc{background:var(--accbg);color:var(--acc2);border-color:var(--accline)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;transition:transform .2s var(--ease),background .2s,border-color .2s}
.btn:hover{border-color:var(--accline)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 24px -10px var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn svg{width:16px;height:16px}
.btn.copied{background:var(--okbg);border-color:transparent;color:var(--ok)}
/* inputs */
.inp,select.inp,textarea.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 6px}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--card2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 0 0 1px var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--mute);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accbg);color:var(--acc2);border-color:var(--accline)}
/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
.chk+.chk{margin-top:8px}
.chk:hover{border-color:var(--line2)}
.chk .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:1px;transition:all .25s var(--ease)}
.chk .box svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:all .25s var(--ease)}
.chk.done{background:var(--okbg);border-color:transparent}
.chk.done .box{background:var(--ok);border-color:var(--ok)}
.chk.done .box svg{opacity:1;transform:none}
.chk.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--dim)}
.chk .t{font-size:14px;font-weight:500}
.chk .d{font-size:12.5px;color:var(--mute);margin-top:2px}
/* code/script block */
.script{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;white-space:pre-wrap;font-size:14px;line-height:1.7;position:relative}
.script mark{background:var(--accbg);color:var(--acc2);border-radius:4px;padding:0 3px}
.script mark.f{background:var(--okbg);color:var(--ok)}
/* accordion */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc-h{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;background:transparent;border:0;cursor:pointer;text-align:left}
.acc-h .num{font:500 12px var(--mono);color:var(--acc2);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accbg);flex:none}
.acc-h b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;display:block}
.acc-h span.s2{font-size:12.5px;color:var(--mute)}
.acc-h .chev{margin-left:auto;width:18px;height:18px;color:var(--mute);transition:transform .35s var(--ease);flex:none}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.acc-in{padding:4px 20px 22px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
/* stat */
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.big-num{font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.04em;line-height:1}
/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;transition:all .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:center}
.orbit{position:relative;aspect-ratio:1;max-width:380px;margin-left:auto;width:100%}
.orbit .ring{position:absolute;inset:0;border:1px dashed var(--line2);border-radius:50%;animation:spin 60s linear infinite}
.orbit .ring.r2{inset:16%;animation-duration:40s;animation-direction:reverse}
.orbit .ring.r3{inset:32%;border-style:solid;border-color:var(--accline)}
.orbit .core{position:absolute;inset:40%;border-radius:24px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:-.04em;box-shadow:0 0 0 10px var(--accbg),0 30px 60px -20px var(--acc)}
.orbit .sat{position:absolute;width:52px;height:52px;margin:-26px;border-radius:14px;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;color:var(--acc2);box-shadow:var(--shadow)}
.orbit .sat svg{width:22px;height:22px}
.orbit .spin{position:absolute;inset:0;animation:spin 60s linear infinite}
.orbit .spin .sat{animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.vcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer}
.vcard .val{font:500 11.5px var(--mono);color:var(--dim)}
.vcard .val s{color:var(--dim)}
.vcard .go{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--acc2)}
.vcard .go svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.vcard:hover .go svg{transform:translateX(4px)}
.path-step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top .logo{padding:0}
  .top .tgl{margin-left:auto}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:29;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:none;font-size:12.5px;font-weight:600;color:var(--mute);text-decoration:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line)}
  .tabs a.on{color:var(--acc2);background:var(--accbg);border-color:var(--accline)}
  main{padding:26px 16px 80px}
  .hero{grid-template-columns:1fr}
  .orbit{max-width:260px;margin:0 auto}
  .c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:981px){.tabs{display:none}}
@media (max-width:620px){.c2,.c3,.c4{grid-template-columns:1fr}.card{padding:18px}h1{margin-top:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* bonus specific styles get appended below */
.pb-niche{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.pb-niche.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,var(--shadow)}
.pb-niche h3{font-size:15px}
.pb-tier{display:flex;flex-direction:column;gap:2px}
.pb-tier.feat{border-color:var(--accline)}
.pb-tname{background:transparent;border:0;border-bottom:1px dashed var(--line2);font-size:16px;font-weight:600;padding:2px 0 6px;outline:none;width:100%;letter-spacing:-.01em}
.pb-tname:focus{border-bottom-color:var(--acc)}
.pb-price{font-size:36px;font-weight:700;letter-spacing:-.04em;margin-top:12px;line-height:1.1}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.06);color:var(--acc2)}}
.pb-del{display:flex;gap:10px;align-items:flex-start;text-align:left;background:transparent;border:0;padding:7px 0;cursor:pointer;font-size:13px;color:var(--dim);width:100%;line-height:1.45}
.pb-del .box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:1px;transition:all .2s}
.pb-del .box svg{width:12px;height:12px;color:#fff;opacity:0}
.pb-del.on{color:var(--ink)}
.pb-del.on .box{background:var(--acc);border-color:var(--acc)}
.pb-del.on .box svg{opacity:1}
.pb-sl{margin-top:16px}
.pb-sl label{display:flex;justify-content:space-between;gap:10px}
.pb-sl label b{color:var(--ink);font-family:var(--mono);font-weight:500}
.pb-out{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pb-time{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px;position:relative}
.pb-time::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--line2)}
.pb-tl{position:relative;padding-top:22px}
.pb-dot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.pb-tl h3{font-size:14px}
.sc-list{display:grid;gap:12px}
.sc-item h3{font-size:16px}
.sc-count .big-num{margin-top:4px}
.pf-thumb{position:relative;aspect-ratio:16/11;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.pf-thumb iframe{position:absolute;top:0;left:0;width:1280px;height:880px;border:0;transform-origin:0 0;pointer-events:none}
.pf-open{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}
.pf-feats{list-style:none;padding:0;margin:10px 0 16px;display:grid;gap:6px}
.pf-feats li{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.pf-feats svg{width:15px;height:15px;color:var(--ok);flex:none}
.pf-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pf-card{display:flex;flex-direction:column}
.pf-tip{display:flex;flex-direction:column;justify-content:center}
.pf-ol{margin:8px 0 0;padding-left:20px;display:grid;gap:8px;font-size:14px;color:var(--mute)}
.pf-ol b{color:var(--ink)}
.pf-modal{position:fixed;inset:0;z-index:60;background:rgba(5,6,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column}
.pf-modal.on{display:flex;animation:viewIn .4s var(--ease)}
.pf-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf-bar b{margin-right:auto;font-size:14px}
.pf-stage{flex:1;min-height:0;display:grid;place-items:center;padding:16px}
.pf-frame{width:100%;height:100%;max-width:1280px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#fff;transition:max-width .5s var(--ease),border-radius .5s}
.pf-frame.m{max-width:390px;border-radius:32px;border-width:8px;border-color:#22242C}
.pf-frame iframe{width:100%;height:100%;border:0;display:block}
body.presenting .app,body.presenting .top,body.presenting .tabs,body.presenting .grid-bg{display:none!important}
#present-frame{display:none}
body.presenting #present-frame{display:block;position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:90}
.br-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.br-search{position:relative;flex:1;min-width:240px;max-width:380px}
.br-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
.br-search .inp{padding-left:36px}
.br-list{display:grid;gap:10px}
.br-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.br-actions{display:flex;gap:6px;flex-wrap:wrap}
.br-item.open{border-color:var(--accline)}
.br-body{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;animation:viewIn .4s var(--ease)}
.br-body>div:last-child{grid-column:1/-1}
.br-f{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.br-fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.br-fl span{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.br-fl .btn{min-height:28px;padding:0 9px;font-size:11.5px}
.br-fv{font-size:13.5px;white-space:pre-wrap;line-height:1.6}
@media (max-width:980px){.pb-time{grid-template-columns:repeat(2,minmax(0,1fr))}.pb-time::before{display:none}}
@media (max-width:620px){.br-body{grid-template-columns:1fr}.pb-time{grid-template-columns:1fr}}

    tl:'Hi {client}! Salamat sa call kanina. Eto ang proposal ko para sa {biz}:\n\nTHE GOAL\n[Goal nila in their own words]\n\nWHAT I WILL BUILD\n- [Deliverable 1]\n- [Deliverable 2]\n- [Deliverable 3]\n\nTIMELINE\nMga 5 working days pagkatanggap ko ng details mo.\n\nINVESTMENT\n[Package name]: {price}, one-time. 50% para mag-start, 50% bago mag-launch.\n\nPara makapag-start tayo, reply ka lang ng "GO" at ise-send ko ang deposit details at isang short form.' },

RENDER.scripts_init = function (v) {
  ['name','niche','link','client','biz','price'].forEach(function (k) { var i = $('#sc-' + k, v); i.value = SC[k] || ''; i.addEventListener('input', function () { SC[k] = i.value; scSave(); list(); if (SC.name && !CHK.p5) { CHK.p5 = true; store.set('chk', CHK); updateProgress(); } }); });

  function list() {
    $('#sc-list', v).innerHTML = SCRIPTS.filter(function (s) { return SC.cat === 'all' || s.cat === SC.cat; }).map(function (s) {
      var catName = SC_CATS.filter(function (c) { return c[0] === s.cat; })[0][1];

    }).join('');
  }
  v.addEventListener('click', function (e) {
    var l = e.target.closest('[data-lang]'); if (l) { SC.lang = l.getAttribute('data-lang'); scSave(); langs(); list(); return; }
    var c = e.target.closest('[data-cat]'); if (c) { SC.cat = c.getAttribute('data-cat'); scSave(); cats(); list(); return; }
    var n = e.target.closest('[data-cnt]'); if (n) { var k = n.getAttribute('data-cnt'); SC[k] = Math.max(0, (SC[k] || 0) + (+n.getAttribute('data-d'))); scSave(); counts(); var el = $('#sc-n-' + k, v); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  });
  function counts() {
    ['dms','replies','calls'].forEach(function (k) { $('#sc-n-' + k, v).textContent = SC[k] || 0; });
    var rr = SC.dms ? Math.round((SC.replies || 0) / SC.dms * 100) : 0;

    if (SC.dms >= 10 && !CHK.p6) { CHK.p6 = true; store.set('chk', CHK); updateProgress(); }
    if (SC.calls >= 1 && !CHK.p7) { CHK.p7 = true; store.set('chk', CHK); updateProgress(); }
  }
  langs(); cats(); list(); counts();
};
